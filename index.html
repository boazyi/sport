<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Segoe UI','Assistant',Arial,sans-serif;direction:rtl;background:#f4f6f9;color:#1a1a2e}
:root{--blue:#1a6eb5;--blue-light:#e8f2fb;--teal:#0f6e56;--teal-light:#e1f5ee;--amber:#ba7517;--amber-light:#faeeda;--red:#a32d2d;--red-light:#fcebeb;--bg:#f4f6f9;--card:#ffffff;--border:#e0e4ea;--text:#1a1a2e;--muted:#6b7280}
@media(prefers-color-scheme:dark){:root{--bg:#0f1117;--card:#1a1d27;--border:#2a2d3a;--text:#e8eaf0;--muted:#8b92a5;--blue-light:#0d2744;--teal-light:#062820;--amber-light:#2a1c00;--red-light:#2a0a0a}}
body{background:var(--bg);color:var(--text)}

/* INSTALL BANNER */
#install-banner{display:none;align-items:center;gap:12px;padding:12px 16px;background:var(--blue);color:#fff;font-size:14px;position:sticky;top:0;z-index:200}
#install-banner.show{display:flex}
#install-banner .install-text{flex:1}
#install-banner .install-title{font-weight:600;font-size:15px}
#install-banner .install-sub{font-size:12px;opacity:0.85;margin-top:2px}
.install-btn{padding:7px 16px;border-radius:20px;background:#fff;color:var(--blue);border:none;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.install-close{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:0 4px;opacity:0.8}

/* HEADER */
.header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.header-icon{width:36px;height:36px;border-radius:10px;object-fit:cover}
.header-title{font-size:18px;font-weight:700;color:var(--text)}
.header-sub{font-size:12px;color:var(--muted);margin-top:1px}

/* TABS */
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:65px;z-index:99}
.tab{flex:1;padding:12px 8px;font-size:14px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--muted);border-bottom:2.5px solid transparent;transition:all .2s;text-align:center}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}

.content{padding:16px;max-width:700px;margin:0 auto}

/* ACTIVITY TYPE CHIPS */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-title{font-size:15px;font-weight:700}
.at-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.at-chip{padding:8px 16px;border-radius:20px;border:1.5px solid var(--border);cursor:pointer;font-size:13px;font-weight:600;background:var(--card);color:var(--muted);transition:all .2s;white-space:nowrap}
.at-chip.pool.sel{background:var(--teal-light);border-color:#0f6e56;color:#0f6e56}
.at-chip.strength.sel{background:var(--amber-light);border-color:#ba7517;color:#ba7517}
.at-chip.cardio.sel{background:#fbeaf0;border-color:#993556;color:#993556}
.at-chip.custom.sel{background:var(--blue-light);border-color:var(--blue);color:var(--blue)}
.at-chip:not(.sel):hover{border-color:var(--blue);color:var(--blue)}

/* EXERCISE CARDS */
.ex-list{display:flex;flex-direction:column;gap:10px}
.ex-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;transition:box-shadow .2s}
.ex-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
.ex-name{font-size:15px;font-weight:700}
.ex-badge{font-size:11px;padding:3px 9px;border-radius:10px;font-weight:600;margin-top:3px;display:inline-block}
.badge-pool{background:var(--teal-light);color:#0f6e56}
.badge-strength{background:var(--amber-light);color:#ba7517}
.badge-cardio{background:#fbeaf0;color:#993556}
.badge-custom{background:var(--blue-light);color:var(--blue)}
.ex-meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px;font-size:12px;color:var(--muted)}
.meta-pill{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:3px 8px}
.done-btn{width:100%;padding:9px;border-radius:10px;border:1.5px solid var(--border);background:transparent;cursor:pointer;font-size:13px;font-weight:600;color:var(--teal);transition:all .2s}
.done-btn:hover{background:var(--teal-light);border-color:#0f6e56}
.done-btn.done{background:var(--teal-light);border-color:#0f6e56;color:#0f6e56}
.del-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:0 4px;line-height:1;transition:color .15s}
.del-btn:hover{color:var(--red)}

/* BUTTON */
.btn{padding:8px 16px;border-radius:10px;border:1.5px solid var(--border);background:transparent;cursor:pointer;font-size:13px;font-weight:600;color:var(--text);transition:all .15s}
.btn:hover{background:var(--bg)}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-primary:hover{background:#155fa0}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:8px}
.fab{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--blue);color:#fff;border:none;border-radius:24px;padding:13px 28px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 20px rgba(26,110,181,0.4);z-index:50;transition:all .2s}
.fab:hover{background:#155fa0;box-shadow:0 6px 24px rgba(26,110,181,0.5)}
.fab:active{transform:translateX(-50%) scale(0.97)}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:300;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
@media(min-width:500px){.overlay{align-items:center}}
.modal{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:500px;padding:20px 16px 32px;max-height:90vh;overflow-y:auto}
@media(min-width:500px){.modal{border-radius:16px;padding:24px}}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.modal-title{font-size:17px;font-weight:700;margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg{display:flex;flex-direction:column;gap:4px}
.fg.full{grid-column:1/-1}
label{font-size:12px;font-weight:600;color:var(--muted)}
input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;direction:rtl}
input:focus,select:focus{outline:none;border-color:var(--blue)}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions .btn{flex:1;text-align:center;justify-content:center}
.add-pos-row{display:none;flex-direction:row-reverse;gap:8px;margin-top:6px;align-items:center}
.add-pos-row input{flex:1}

/* HISTORY */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}
.stat-num{font-size:26px;font-weight:800;color:var(--blue)}
.stat-lbl{font-size:11px;color:var(--muted);margin-top:2px;font-weight:600}
.filter-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.fc{padding:6px 14px;border-radius:16px;border:1.5px solid var(--border);font-size:12px;font-weight:600;cursor:pointer;background:transparent;color:var(--muted);transition:all .15s}
.fc.active{background:var(--blue-light);border-color:var(--blue);color:var(--blue)}
.hist-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 16px;margin-bottom:10px}
.hist-date{font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:600}
.hist-name{font-size:14px;font-weight:700}
.hist-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:12px;color:var(--muted)}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty-icon{font-size:40px;margin-bottom:12px}

<!-- Exercise Modal -->
<div class="overlay" id="ex-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="ex-modal-title">תרגיל חדש</div>
    <div class="form-grid">
      <div class="fg full">
        <label>שם התרגיל</label>
        <input id="f-name" type="text" placeholder="למשל: שחייה חופשית"/>
      </div>
      <div class="fg full">
        <label>סוג פעילות</label>
        <select id="f-activity"></select>
      </div>
      <div class="fg full">
        <label>תנוחה</label>
        <select id="f-pos">
          <option>עמידה</option><option>ישיבה</option><option>שכיבה</option><option>במים</option><option>מתקן כושר</option>
        </select>
        <div class="add-pos-row" id="add-pos-row">
          <input id="pos-input" type="text" placeholder="שם תנוחה"/>
          <button class="btn btn-sm btn-primary" onclick="addPos()">הוסף</button>
        </div>
        <button class="btn btn-sm" style="margin-top:6px;width:fit-content" onclick="toggleAddPos()">+ תנוחה מותאמת</button>
      </div>
      <div class="fg"><label>סטים</label><input id="f-sets" type="number" min="0" placeholder="3"/></div>
      <div class="fg"><label>חזרות</label><input id="f-reps" type="number" min="0" placeholder="10"/></div>
      <div class="fg"><label>משקל (ק"ג)</label><input id="f-weight" type="number" min="0" step="0.5" placeholder="0"/></div>
      <div class="fg"><label>משך (דקות)</label><input id="f-dur" type="number" min="0" placeholder="0"/></div>

    </div>

  </div>
</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyDFF6FoZUhwtQUykjuSRMMGRnr5gH2u8rw",
  authDomain: "sport-2297b.firebaseapp.com",
  databaseURL: "https://sport-2297b-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "sport-2297b",
  storageBucket: "sport-2297b.firebasestorage.app",
  messagingSenderId: "1079157877126",
  appId: "1:1079157877126:web:eb3bc3b0f7085ff952e407"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const UID = 'boazyi';

const DEF_TYPES=[{id:'pool',label:'אימון בבריכה',cls:'pool'},{id:'strength',label:'אימון כח',cls:'strength'},{id:'cardio',label:'אימון אירובי',cls:'cardio'}];
let types=[];
let exercises=[];
let workoutLog=[];
let selType=null;
let histFilter='all';
let deferredPrompt=null;
let initialized=false;
let ignoreNext=0;


// ── Firebase helpers ──────────────────────────────────────
function saveAll(){
  db.ref(UID+'/types').set(types);
  db.ref(UID+'/exercises').set(exercises);
  db.ref(UID+'/history').set(workoutLog);
}

// ── PWA Install ───────────────────────────────────────────
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); deferredPrompt=e;
  document.getElementById('install-banner').classList.add('show');
});
window.addEventListener('appinstalled',()=>{
  document.getElementById('install-banner').classList.remove('show');
  deferredPrompt=null;
});
function installApp(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{deferredPrompt=null;document.getElementById('install-banner').classList.remove('show');});}}
function dismissInstall(){document.getElementById('install-banner').classList.remove('show');}
window.installApp=installApp;
window.dismissInstall=dismissInstall;

// ── Tabs ─────────────────────────────────────────────────
function switchTab(tab){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['exercises','history'][i]===tab));
  document.getElementById('panel-exercises').style.display=tab==='exercises'?'block':'none';
  document.getElementById('panel-history').style.display=tab==='history'?'block':'none';
  document.querySelector('.fab').style.display=tab==='exercises'?'block':'none';
  if(tab==='history') renderHistory();
}
window.switchTab=switchTab;

// ── Helpers ───────────────────────────────────────────────
function getBadgeCls(at){return at?.cls==='pool'?'badge-pool':at?.cls==='strength'?'badge-strength':at?.cls==='cardio'?'badge-cardio':'badge-custom';}
function getChipSel(at){return at?.cls==='pool'?'pool sel':at?.cls==='strength'?'strength sel':at?.cls==='cardio'?'cardio sel':'custom sel';}

// ── Render types ──────────────────────────────────────────
function renderTypes(){
  document.getElementById('at-chips').innerHTML=types.map(t=>`
    <div class="at-chip-wrap">
      <div class="at-chip ${t.id===selType?getChipSel(t):t.cls||''}" onclick="selTypeClick('${t.id}')">${t.label}</div>
      <div class="at-chip-actions">
        <button class="chip-btn" onclick="openEditType('${t.id}')" title="ערוך">✏️</button>
        <button class="chip-btn chip-del" onclick="deleteType('${t.id}')" title="מחק">🗑</button>
      </div>
    </div>`).join('');
}
function selTypeClick(id){selType=id;renderTypes();renderEx();}
window.selTypeClick=selTypeClick;

// ── Render exercises ──────────────────────────────────────
function renderEx(){
  const at=types.find(t=>t.id===selType);
  document.getElementById('ex-title').textContent=at?at.label:'תרגילים';
  const list=document.getElementById('ex-list');
  const items=exercises.filter(e=>e.aId===selType);
  if(!items.length){
    list.innerHTML='<div class="empty"><div class="empty-icon">🏋️</div><div class="empty-txt">אין תרגילים עדיין</div><div style="font-size:13px;margin-top:6px;color:var(--muted)">לחץ &quot;+ תרגיל חדש&quot; להוספה</div></div>';
    return;
  }
  list.innerHTML=items.map(ex=>{
    const ri=exercises.indexOf(ex);
    const meta=[];
    if(ex.pos)meta.push(ex.pos);
    if(ex.sets)meta.push('סטים: '+ex.sets);
    if(ex.reps)meta.push('חזרות: '+ex.reps);
    if(ex.weight)meta.push(ex.weight+'ק"ג');
    if(ex.dur)meta.push(ex.dur+"'");
    if(ex.dist)meta.push(ex.dist+"מ'");
    return `<div class="ex-card">
      <div class="ex-top">
        <div><div class="ex-name">${ex.name}</div><span class="ex-badge ${getBadgeCls(at)}">${at?.label||''}</span></div>
        <div style="display:flex;gap:6px">
          <button class="del-btn" style="color:var(--blue)" onclick="openEditEx(${ri})" title="ערוך">✏</button>
          <button class="del-btn" onclick="delEx(${ri})">&#xD7;</button>
        </div>
      </div>
      <div class="ex-meta">${meta.map(m=>`<span class="meta-pill">${m}</span>`).join('')}</div>
      <button class="done-btn ${ex.done?'done':''}" onclick="markDone(${ri})">${ex.done?'✓ בוצע היום!':'סמן כבוצע'}</button>
    </div>`;
  }).join('');
}

function markDone(i){
  const wasDone = exercises[i].done;
  exercises[i].done = !wasDone;
  if(!wasDone){
    const entry = {name:exercises[i].name,aId:exercises[i].aId,pos:exercises[i].pos,sets:exercises[i].sets,reps:exercises[i].reps,weight:exercises[i].weight,dur:exercises[i].dur,dist:exercises[i].dist,date:new Date().toISOString()};
    workoutLog = [entry, ...workoutLog];
  }
  ignoreNext = 2;
  db.ref(UID+'/exercises').set(exercises);
  db.ref(UID+'/history').set(workoutLog);
  renderEx();
}

function delEx(i){
  if(confirm('למחוק?')){exercises.splice(i,1);saveAll();renderEx();}
}
window.delEx=delEx;

// ── Exercise modal ────────────────────────────────────────
let editExIdx=null;

function openExModal(){
  if(!selType){alert('בחר סוג פעילות תחילה');return;}
  editExIdx=null;
  document.getElementById('ex-modal-title').textContent='תרגיל חדש';
  document.getElementById('f-activity').innerHTML=types.map(t=>`<option value="${t.id}" ${t.id===selType?'selected':''}>${t.label}</option>`).join('');
  ['f-name','f-sets','f-reps','f-weight','f-dur','f-dist'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('ex-modal').classList.add('open');
}
window.openExModal=openExModal;

function openEditEx(i){
  editExIdx=i;
  const ex=exercises[i];
  document.getElementById('ex-modal-title').textContent='ערוך תרגיל';
  document.getElementById('f-activity').innerHTML=types.map(t=>`<option value="${t.id}" ${t.id===ex.aId?'selected':''}>${t.label}</option>`).join('');
  document.getElementById('f-name').value=ex.name;
  document.getElementById('f-pos').value=ex.pos||'עמידה';
  document.getElementById('f-sets').value=ex.sets||'';
  document.getElementById('f-reps').value=ex.reps||'';
  document.getElementById('f-weight').value=ex.weight||'';
  document.getElementById('f-dur').value=ex.dur||'';
  document.getElementById('f-dist').value=ex.dist||'';
  document.getElementById('ex-modal').classList.add('open');
}
window.openEditEx=openEditEx;

function saveExercise(){
  const name=document.getElementById('f-name').value.trim();
  if(!name){alert('נא להזין שם');return;}
  const data={name,aId:document.getElementById('f-activity').value,pos:document.getElementById('f-pos').value,sets:document.getElementById('f-sets').value,reps:document.getElementById('f-reps').value,weight:document.getElementById('f-weight').value,dur:document.getElementById('f-dur').value,dist:document.getElementById('f-dist').value};
  if(editExIdx!==null){exercises[editExIdx]={...exercises[editExIdx],...data};}
  else{exercises.push({...data,done:false});}
  saveAll();closeModal('ex-modal');renderEx();
}
window.saveExercise=saveExercise;

// ── Type modal ────────────────────────────────────────────
let editTypeId=null;

function openTypeModal(){
  editTypeId=null;
  document.getElementById('type-name').value='';
  document.getElementById('type-modal-title').textContent='סוג פעילות חדש';
  document.getElementById('type-save-btn').textContent='הוסף';
  document.getElementById('type-modal').classList.add('open');
}
window.openTypeModal=openTypeModal;

function openEditType(id){
  editTypeId=id;
  const t=types.find(t=>t.id===id);
  document.getElementById('type-name').value=t.label;
  document.getElementById('type-modal-title').textContent='ערוך סוג פעילות';
  document.getElementById('type-save-btn').textContent='שמור שינויים';
  document.getElementById('type-modal').classList.add('open');
}
window.openEditType=openEditType;

function saveType(){
  const n=document.getElementById('type-name').value.trim();
  if(!n)return;
  if(editTypeId){const t=types.find(t=>t.id===editTypeId);if(t)t.label=n;}
  else{types.push({id:'c_'+Date.now(),label:n,cls:'custom'});}
  saveAll();closeModal('type-modal');renderTypes();
}
window.saveType=saveType;

function deleteType(id){
  const t=types.find(t=>t.id===id);
  const hasEx=exercises.some(e=>e.aId===id);
  if(hasEx){alert('לא ניתן למחוק סוג פעילות שיש בו תרגילים. מחק תחילה את התרגילים.');return;}
  if(confirm('למחוק את סוג הפעילות "'+t.label+'"?')){
    types=types.filter(t=>t.id!==id);
    if(selType===id) selType=types[0]?.id;
    saveAll();renderTypes();renderEx();
  }
}
window.deleteType=deleteType;

// ── Shared helpers ────────────────────────────────────────
function toggleAddPos(){const r=document.getElementById('add-pos-row');r.style.display=r.style.display==='flex'?'none':'flex';}
function addPos(){const v=document.getElementById('pos-input').value.trim();if(!v)return;const s=document.getElementById('f-pos');s.add(new Option(v,v));s.value=v;document.getElementById('add-pos-row').style.display='none';}
window.toggleAddPos=toggleAddPos;
window.addPos=addPos;

function closeModal(id){
  document.getElementById(id).classList.remove('open');
  if(id==='ex-modal'){editExIdx=null;document.getElementById('ex-modal-title').textContent='תרגיל חדש';}
  if(id==='type-modal'){editTypeId=null;document.getElementById('type-modal-title').textContent='סוג פעילות חדש';document.getElementById('type-save-btn').textContent='הוסף';}
}
window.closeModal=closeModal;
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open');}));

// ── History ───────────────────────────────────────────────
function renderHistory(){
  const total=workoutLog.length;
  const week=workoutLog.filter(h=>(new Date()-new Date(h.date))<7*864e5).length;
  const uTypes=[...new Set(workoutLog.map(h=>h.aId))].length;
  document.getElementById('stats-grid').innerHTML=`
    <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-lbl">סה"כ אימונים</div></div>
    <div class="stat-card"><div class="stat-num">${week}</div><div class="stat-lbl">השבוע</div></div>
    <div class="stat-card"><div class="stat-num">${uTypes}</div><div class="stat-lbl">סוגי פעילות</div></div>`;
  document.getElementById('hist-filters').innerHTML=
    `<button class="fc ${histFilter==='all'?'active':''}" onclick="setHistFilter('all')">הכל</button>`+
    types.map(t=>`<button class="fc ${histFilter===t.id?'active':''}" onclick="setHistFilter('${t.id}')">${t.label}</button>`).join('');
  const filtered=histFilter==='all'?workoutLog:workoutLog.filter(h=>h.aId===histFilter);
  const listEl=document.getElementById('hist-list');
  if(!filtered.length){listEl.innerHTML='<div class="empty"><div class="empty-icon">📋</div><div class="empty-txt">אין היסטוריה עדיין</div></div>';return;}
  listEl.innerHTML=filtered.map(h=>{
    const realIdx=workoutLog.indexOf(h);
    const at=types.find(t=>t.id===h.aId);
    const meta=[];
    if(h.pos)meta.push(h.pos);if(h.sets)meta.push('סטים: '+h.sets);if(h.reps)meta.push('חזרות: '+h.reps);
    if(h.weight)meta.push(h.weight+'ק"ג');if(h.dur)meta.push(h.dur+"'");if(h.dist)meta.push(h.dist+"מ'");
    const d=new Date(h.date).toLocaleString('he-IL',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
    return `<div class="hist-item">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
        <div class="hist-date" style="margin-bottom:0">${d}</div>
        <div style="display:flex;gap:4px">
          <button class="del-btn" style="color:var(--blue);font-size:15px" onclick="openEditHistory(${realIdx})" title="ערוך">✏</button>
          <button class="del-btn" style="font-size:18px" onclick="deleteHistory(${realIdx})" title="מחק">&#xD7;</button>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="hist-name">${h.name}</div>
        ${at?`<span class="ex-badge ${getBadgeCls(at)}">${at.label}</span>`:''}
      </div>
      <div class="hist-meta">${meta.map(m=>`<span>${m}</span>`).join('')}</div>
    </div>`;
  }).join('');
}
function deleteHistory(i){
  if(confirm('למחוק את הפעילות מההיסטוריה?')){
    workoutLog.splice(i,1);
    ignoreNext=1;
    db.ref(UID+'/history').set(workoutLog);
    renderHistory();
  }
}

let editHistIdx=null;
function openEditHistory(i){
  editHistIdx=i;
  const h=workoutLog[i];
  document.getElementById('fh-name').value=h.name||'';
  document.getElementById('fh-activity').innerHTML=types.map(t=>`<option value="${t.id}" ${t.id===h.aId?'selected':''}>${t.label}</option>`).join('');
  document.getElementById('fh-pos').value=h.pos||'עמידה';
  document.getElementById('fh-sets').value=h.sets||'';
  document.getElementById('fh-reps').value=h.reps||'';
  document.getElementById('fh-weight').value=h.weight||'';
  document.getElementById('fh-dur').value=h.dur||'';
  document.getElementById('fh-dist').value=h.dist||'';
  document.getElementById('hist-edit-modal').classList.add('open');
}

function saveHistoryEdit(){
  const i=editHistIdx;
  workoutLog[i]={
    ...workoutLog[i],
    name:document.getElementById('fh-name').value.trim(),
    aId:document.getElementById('fh-activity').value,
    pos:document.getElementById('fh-pos').value,
    sets:document.getElementById('fh-sets').value,
    reps:document.getElementById('fh-reps').value,
    weight:document.getElementById('fh-weight').value,
    dur:document.getElementById('fh-dur').value,
    dist:document.getElementById('fh-dist').value,
  };
  ignoreNext=1;
  db.ref(UID+'/history').set(workoutLog);
  closeModal('hist-edit-modal');
  renderHistory();
}

function setHistFilter(f){histFilter=f;renderHistory();}
window.setHistFilter=setHistFilter;
window.renderHistory=renderHistory;

// ── Status indicator ──────────────────────────────────────
function showStatus(msg, color='#0f6e56'){
  const el=document.getElementById('sync-status');
  if(el){el.textContent=msg;el.style.color=color;setTimeout(()=>el.textContent='',3000);}
}

// ── Init: load from Firebase with live sync ───────────────
db.ref(UID).on('value', (snapshot) => {
  if(ignoreNext > 0){ ignoreNext--; return; }
  const data = snapshot.val();
  if(data) {
    types = data.types || DEF_TYPES;
    exercises = Array.isArray(data.exercises) ? data.exercises : (data.exercises ? Object.values(data.exercises) : []);
    workoutLog = Array.isArray(data.history) ? data.history : (data.history ? Object.values(data.history) : []);
  } else {
    // First time - save defaults
    types = DEF_TYPES;
    exercises = [];
    workoutLog = [];
    saveAll();
  }
  if(!selType || !types.find(t=>t.id===selType)) selType = types[0]?.id;
  renderTypes();
  renderEx();
  if(document.getElementById('panel-history').style.display!=='none') renderHistory();
  if(!initialized){ showStatus('✓ מסונכרן'); initialized=true; }
}, error => {
  console.error('Firebase error:', error);
  // Fallback to defaults
  types = DEF_TYPES;
  exercises = [];
  workoutLog = [];
  selType = types[0]?.id;
  renderTypes();
  renderEx();
  showStatus('⚠ שגיאת חיבור', '#a32d2d');
});

</script>

<!-- History Edit Modal -->
<div class="overlay" id="hist-edit-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">ערוך פעילות</div>
    <div class="form-grid">
      <div class="fg full"><label>שם התרגיל</label><input id="fh-name" type="text"/></div>
      <div class="fg full"><label>סוג פעילות</label><select id="fh-activity"></select></div>
      <div class="fg full"><label>תנוחה</label>
        <select id="fh-pos">
          <option>עמידה</option><option>ישיבה</option><option>שכיבה</option><option>במים</option><option>מתקן כושר</option>
        </select>
      </div>
      <div class="fg"><label>סטים</label><input id="fh-sets" type="number" min="0"/></div>
      <div class="fg"><label>חזרות</label><input id="fh-reps" type="number" min="0"/></div>
      <div class="fg"><label>משקל (ק"ג)</label><input id="fh-weight" type="number" min="0" step="0.5"/></div>
      <div class="fg"><label>משך (דקות)</label><input id="fh-dur" type="number" min="0"/></div>
      <div class="fg full"><label>מרחק (מטר)</label><input id="fh-dist" type="number" min="0"/></div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('hist-edit-modal')">ביטול</button>
      <button class="btn btn-primary" onclick="saveHistoryEdit()">שמור</button>
    </div>
  </div>
</div>

<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(e=>console.log(e));
}
</script>
</body>
